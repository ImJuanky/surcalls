<header class="navbar" [class.navbar--scrolled]="isScrolled()">
    <div class="navbar__container">

      <!-- Logo -->
      <a href="#hero" class="navbar__logo" aria-label="SurCalls - Inicio">
        <span
          class="navbar__logo-mark"
          (pointermove)="onLogoPointerMove($event)"
          (pointerleave)="onLogoPointerLeave($event)"
        >
          <span class="navbar__logo-shadow" aria-hidden="true"></span>
          <img class="navbar__logo-mark-img" src="logo-mark.png" alt="" width="149" height="92" />
        </span>
        <span class="navbar__logo-text">Sur<span class="navbar__logo-accent">Calls</span></span>
      </a>

      <!-- Navegación desktop -->
      <nav
        class="navbar__links"
        aria-label="Navegación principal"
        #linksNav
        (mouseleave)="onNavLeave()"
        (focusout)="onNavFocusOut($event)"
      >
        <span
          class="navbar__pill"
          aria-hidden="true"
          [class.navbar__pill--visible]="pillReady()"
          [style.transform]="'translateX(' + pillLeft() + 'px)'"
          [style.width.px]="pillWidth()"
        ></span>

        @for (item of navItems; track item.id) {
          <a
            #navLink
            [href]="'#' + item.id"
            class="navbar__link"
            [class.navbar__link--active]="activeSection() === item.id"
            [attr.aria-current]="activeSection() === item.id ? 'true' : null"
            (mouseenter)="onLinkHover(item.id)"
            (focus)="onLinkHover(item.id)"
          >{{ item.label }}</a>
        }
      </nav>

      <!-- CTA desktop -->
      <a href="#contact" class="navbar__cta">
        <span class="navbar__cta-text">Solicita una demo</span>
      </a>

      <!-- Botón hamburguesa (mobile) -->
      <button
        #toggleBtn
        class="navbar__toggle"
        [class.navbar__toggle--active]="isMenuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="isMenuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

    <!-- Overlay mobile -->
    <div
      #mobileMenu
      id="mobile-menu"
      class="navbar__mobile-menu"
      [class.navbar__mobile-menu--open]="isMenuOpen()"
      role="dialog"
      aria-modal="true"
      aria-label="Menú de navegación"
      [attr.inert]="isMenuOpen() ? null : ''"
    >
      <nav class="navbar__mobile-links" aria-label="Navegación móvil">
        @for (item of navItems; track item.id) {
          <a
            [href]="'#' + item.id"
            class="navbar__mobile-link"
            [class.navbar__mobile-link--active]="activeSection() === item.id"
            (click)="closeMenu(false)"
          >{{ item.label }}</a>
        }
      </nav>
      <a href="#contact" class="navbar__mobile-cta" (click)="closeMenu(false)">
        Solicita una demo
      </a>
    </div>
  </header>
