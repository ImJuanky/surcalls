<div
  class="section-title"
  [class.section-title--left]="align() === 'left'"
  [class]="'section-title--' + size()"
>
  @if (kicker()) {
    <span class="section-title__kicker">{{ kicker() }}</span>
  }

  <h2 class="section-title__title">{{ title() }}</h2>

  @if (description()) {
    <p class="section-title__description">{{ description() }}</p>
  }
</div>
