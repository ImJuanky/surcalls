<section class="services" id="services">
  <div class="container">
    <app-section-title
      kicker="Servicios"
      title="Todo lo que necesitas para automatizar tu negocio"
      description="Seis soluciones de IA que trabajan juntas: atienden a tus clientes, venden por ti y liberan tiempo de tu equipo."
    ></app-section-title>

    <div class="services__layout" appScrollReveal>
      <div class="services__list" role="tablist" aria-label="Servicios de SURCALLS" [style.--active-index]="activeIndex()">
        <span class="services__indicator" aria-hidden="true"></span>

        @for (service of services; track service.title; let i = $index) {
          <button
            type="button"
            role="tab"
            class="services__tab"
            [class.services__tab--active]="i === activeIndex()"
            [attr.aria-selected]="i === activeIndex()"
            (click)="select(i)"
            (mouseenter)="select(i)"
          >
            <span class="services__tab-index">{{ (i + 1).toString().padStart(2, '0') }}</span>
            <span class="services__tab-name">{{ service.title }}</span>
            <span class="services__tab-arrow" aria-hidden="true">→</span>
          </button>
        }
      </div>

      <div class="services__detail" role="tabpanel">
        <span class="services__detail-icon" aria-hidden="true">{{ active.icon }}</span>
        <h3 class="services__detail-title">{{ active.title }}</h3>
        <p class="services__detail-text">{{ active.text }}</p>
        <app-button variant="secondary" [href]="active.anchor">Más información</app-button>
      </div>
    </div>
  </div>
</section>
