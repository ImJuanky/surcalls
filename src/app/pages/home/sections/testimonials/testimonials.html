<section class="testimonials" id="testimonials">
  <div class="container">
    <app-section-title
      kicker="Por qué confiar en nosotros"
      title="Somos una empresa joven. Preferimos las garantías a los logos de encargo"
      description="No vamos a inventarte opiniones de clientes que no existen. Preferimos comprometernos con esto:"
    ></app-section-title>

    <div class="testimonials__grid">
      @for (item of guarantees; track item.title; let i = $index) {
        <article class="testimonials__ticket" [appScrollReveal]="i * 80">
          <div class="testimonials__ticket-top">
            <span class="testimonials__stamp">{{ item.icon }}</span>
            <span class="testimonials__ticket-label">Garantía Nº {{ (i + 1).toString().padStart(2, '0') }}</span>
          </div>

          <span class="testimonials__perforation" aria-hidden="true"></span>

          <div class="testimonials__ticket-bottom">
            <h3 class="testimonials__ticket-title">{{ item.title }}</h3>
            <p class="testimonials__ticket-text">{{ item.text }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
